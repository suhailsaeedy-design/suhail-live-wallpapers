name: Import realistic wallpapers B
on:
  push:
    paths:
      - '.github/workflows/import-real-wallpapers-b.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download user-approved wallpapers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/wallpapers/real
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/f96df28d-7efe-4260-931b-ffbb79574cab.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDEwMmEwOWNkZWUzOWVmNSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk2MzIyOH0.7x--gz08QCF0fNCaLH06woTXXmtVC6UfXVHpR6e8DbY' -o 'assets/wallpapers/real/medina-golden-hour.jpeg'
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/f3f7fdef-b291-48e6-b606-d46592aa4d38.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjZhN2M2OGQyMmFiZWI2YiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk1OTM3M30.fwyGPxTEKYplEuZ12LE1e1YwItTogkbCvsCxK7Wrdr8' -o 'assets/wallpapers/real/mecca-tawaf-night.jpeg'
      - name: Commit wallpapers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wallpapers/real/medina-golden-hour.jpeg assets/wallpapers/real/mecca-tawaf-night.jpeg
          git diff --cached --quiet && exit 0
          git commit -m "Add user-approved realistic wallpapers"
          git push
