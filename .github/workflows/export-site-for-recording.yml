name: Export site for recording
on:
  push:
    paths:
      - '.github/workflows/export-site-for-recording.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload current website source
        uses: actions/upload-artifact@v4
        with:
          name: suhail-live-wallpapers-site
          path: |
            index.html
            manifest.webmanifest
            service-worker.js
            data
            assets
          if-no-files-found: error
          retention-days: 1
