name: Import generated realistic wallpapers v2
on:
  push:
    paths:
      - '.github/workflows/import-generated-real-wallpapers-v2.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download six generated realistic wallpapers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/wallpapers/real-v2
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/41c9e4ac-b389-4af4-914a-637c7b5244a0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMmE1OWQwMjcwMDA3ZmFhZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk2MTA2M30.UEzTii7_7cLE-p0oVrvAWmNp17VKKpUMTyIrRzpvTgQ' -o assets/wallpapers/real-v2/aurora-snowy-cabin.png
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/2cd9354b-78cf-4f32-bbf2-a99ec2c18911.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOGNkZGY1MjBjMzViZjE1OSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk1NjQ0OH0.5LpINdpJ2BiGqyhbhFX9HwMgUJNPHQdF2AXI71ZDdbI' -o assets/wallpapers/real-v2/tropical-lagoon-sunrise.png
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/c71e915e-b36d-480d-a131-41a03f038aa9.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDY1MjE4YTM4M2U2M2Y1NCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk3ODk3OX0.0fwEPwGySmip5a_N24S-2BkCfviBI9lYd06V5gJR7NI' -o assets/wallpapers/real-v2/lavender-golden-hour.png
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/eef90d44-2c14-4ff9-acbf-68af7d9b6ff8.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2FkOGI0NmQwOTc3MzA2NSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDkzNTkxN30.UnZt0nphQcu9KpxhswtPgpJOiuzMcALHZyi5iJR5gVM' -o assets/wallpapers/real-v2/skyline-reading-lounge.png
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/f7d42f27-8af5-4e76-ab52-dd6bcd859887.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDQ1ZWU5YTQ2NDA5Y2IxOCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDkyNTk4OH0.08g5ZOnrfbmcBqYi6_2wmRnRSnRaEpsIKLjBoN8lqRI' -o assets/wallpapers/real-v2/grand-canyon-golden-river.png
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/9fbbafe4-00fc-46a7-8808-03e01be64720.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOTZlODVhYjk1MWI3Y2M1MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDkyOTk3N30.1y5opXtHaC923Wfi59w_itwy4YdmnMY619MFI1eK81g' -o assets/wallpapers/real-v2/sakura-koi-garden.png
          file assets/wallpapers/real-v2/*.png
      - name: Commit imported wallpapers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wallpapers/real-v2
          git diff --cached --quiet && exit 0
          git commit -m "Add six new realistic generated wallpapers"
          git pull --rebase origin main
          git push
