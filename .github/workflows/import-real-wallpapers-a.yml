name: Import realistic wallpapers A
on:
  push:
    paths:
      - '.github/workflows/import-real-wallpapers-a.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download user-approved wallpapers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/wallpapers/real
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/384dad55-a77d-40b6-8cce-5204a72d7eb3.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWMwNTFmMmY3OWJjYjRmNSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk0NTgzOX0.GvC4pC_J1GbIE_WzuCPoamP_i9bz3bsHW6tvSGE9h-Y' -o 'assets/wallpapers/real/neon-city-rooftop.jpeg'
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/102f33d6-5152-40d8-8922-13f85176f440.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDlmNDJjZGM5MWVhMjJlYiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk3MTYxMn0.OLS9pesWRFFN_YONKRdG32pvHjx6_K2gXj3o4pIKuwg' -o 'assets/wallpapers/real/sunset-city-office.jpeg'
      - name: Commit wallpapers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wallpapers/real/neon-city-rooftop.jpeg assets/wallpapers/real/sunset-city-office.jpeg
          git diff --cached --quiet && exit 0
          git commit -m "Add user-approved realistic wallpapers"
          git pull --rebase origin main
          git push
