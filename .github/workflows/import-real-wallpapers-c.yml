name: Import realistic wallpapers C
on:
  push:
    paths:
      - '.github/workflows/import-real-wallpapers-c.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download user-approved wallpapers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/wallpapers/real
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/2e4ccf70-90d7-4f90-9102-9324b86929fc.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiM2ZmZmViNDcxN2EwODZkZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk0MjkxOX0.TxmA2ptpmWTPfmtTiRUOgTiKnuEd2I6W3acHIv7v4Cs' -o 'assets/wallpapers/real/coastal-highway-sunset.jpeg'
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/c62b7d0d-0a13-43f5-9f74-7d06edeb524d.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWE3MTMzYTI0MDdkYTQ0YSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk0ODAwMn0.7NX4flUHUWSzRdzQ0ZNCDXVNnzBvIXXswBA5jTgpA_s' -o 'assets/wallpapers/real/golden-desert-highway.jpeg'
      - name: Commit wallpapers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wallpapers/real/coastal-highway-sunset.jpeg assets/wallpapers/real/golden-desert-highway.jpeg
          git diff --cached --quiet && exit 0
          git commit -m "Add user-approved realistic wallpapers"
          git push
