name: Quality checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check data/wallpapers.js
          node --check service-worker.js
      - name: Verify required project files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f assets/css/styles.css
          test -f assets/js/app.js
          test -f assets/icons/icon.svg
          test -f data/wallpapers.js
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest valid')"
